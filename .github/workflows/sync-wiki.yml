name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Publish wiki directory to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          rm -rf .wiki-repo

          if git clone "$WIKI_URL" .wiki-repo; then
            echo "Existing Wiki repository cloned."
          else
            echo "Wiki repository is not initialized yet; attempting first push."
            mkdir .wiki-repo
            git -C .wiki-repo init
            git -C .wiki-repo remote add origin "$WIKI_URL"
          fi

          find .wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp wiki/*.md .wiki-repo/

          git -C .wiki-repo config user.name "github-actions[bot]"
          git -C .wiki-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .wiki-repo add -A

          if git -C .wiki-repo diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git -C .wiki-repo commit -m "Sync Wiki from main repository"
          git -C .wiki-repo branch -M master
          git -C .wiki-repo push origin master
